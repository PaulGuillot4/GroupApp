services:
  postgres:
    image: postgres:15-alpine
    container_name: gms_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-groupsapp_ms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - gms_postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: gms_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: gms_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: gms_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-groupsapp_mongo}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-groupsapp_messages}
    ports:
      - "27017:27017"
    volumes:
      - gms_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gms_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: gms_auth
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-groupsapp_ms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me}
    ports:
      - "50051:50051"
    restart: unless-stopped

  users:
    build:
      context: .
      dockerfile: services/users/Dockerfile
    container_name: gms_users
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-groupsapp_ms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "50052:50052"
      - "8003:8003"
    restart: unless-stopped

  groups:
    build:
      context: .
      dockerfile: services/groups/Dockerfile
    container_name: gms_groups
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-groupsapp_ms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "50053:50053"
    restart: unless-stopped

  messaging:
    build:
      context: .
      dockerfile: services/messaging/Dockerfile
    container_name: gms_messaging
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_DB: ${MONGO_DB:-groupsapp_messages}
      MONGO_USER: ${MONGO_USER:-admin}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-groupsapp_mongo}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKER: kafka:9092
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me}
      AUTH_GRPC: auth:50051
      GROUPS_GRPC: groups:50053
      USERS_GRPC: users:50052
    ports:
      - "50054:50054"
    restart: unless-stopped

  files:
    build:
      context: .
      dockerfile: services/files/Dockerfile
    container_name: gms_files
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-groupsapp_ms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      FILES_BASE_URL: http://localhost:8000/media
    volumes:
      - gms_files_data:/app/uploads
    ports:
      - "50055:50055"
    restart: unless-stopped

  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    container_name: gms_notifications
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
      MESSAGING_GRPC: messaging:50054
      USERS_GRPC: users:50052
      GROUPS_GRPC: groups:50053
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: gms_gateway
    depends_on:
      - auth
      - users
      - groups
      - messaging
      - files
    environment:
      AUTH_GRPC: auth:50051
      USERS_GRPC: users:50052
      GROUPS_GRPC: groups:50053
      MESSAGING_GRPC: messaging:50054
      FILES_GRPC: files:50055
      USERS_HTTP: http://users:8003
      FILES_HTTP: http://files:8002
      MESSAGING_WS: ws://messaging:8001
      FILES_BASE_URL: http://localhost:8000/media
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  gms_postgres_data:
  gms_mongo_data:
  gms_files_data:
