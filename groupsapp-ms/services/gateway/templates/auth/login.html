{% extends 'base.html' %}

{% block content %}
<div class="flex-1 flex items-center justify-center bg-[#111b21]">
    <div class="bg-[#202c33] p-8 rounded-lg shadow-lg w-full max-w-md border border-[#2a3942]">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-light text-[#e9edef] mb-2">GroupsApp</h1>
            <p class="text-gray-400">Sign in to your account</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div id="error-msg" class="hidden bg-red-900/50 text-red-200 p-3 rounded text-sm text-center"></div>

            <div>
                <label for="username" class="block text-sm font-medium text-gray-300 mb-1">Username</label>
                <input type="text" id="username" required
                       class="w-full bg-[#2a3942] border border-transparent focus:border-[#00a884] rounded px-4 py-2 text-[#e9edef] outline-none transition-colors">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                <input type="password" id="password" required
                       class="w-full bg-[#2a3942] border border-transparent focus:border-[#00a884] rounded px-4 py-2 text-[#e9edef] outline-none transition-colors">
            </div>

            <button type="submit"
                    class="w-full bg-[#00a884] hover:bg-[#008f6f] text-[#111b21] font-semibold py-2 px-4 rounded transition-colors focus:outline-none focus:ring-2 focus:ring-[#00a884] focus:ring-offset-2 focus:ring-offset-[#202c33]">
                Sign In
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-gray-400">
            Don't have an account?
            <a href="/auth/register/" class="text-[#00a884] hover:text-[#008f6f] font-semibold transition-colors">Register</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Redirect to app if already logged in
        if (localStorage.getItem('access_token')) {
            window.location.href = '/app/';
            return;
        }

        const form = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('refresh_token', data.refresh_token);
                    localStorage.setItem('user_id', data.user_id);
                    localStorage.setItem('user_data', JSON.stringify({ id: data.user_id, username: data.username, email: data.email }));
                    window.location.href = '/app/';
                } else {
                    errorMsg.textContent = data.detail || 'Login failed';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = 'Server error. Please try again later.';
                errorMsg.classList.remove('hidden');
            }
        });
    });
</script>
{% endblock %}
