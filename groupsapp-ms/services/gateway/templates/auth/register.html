{% extends 'base.html' %}

{% block content %}
<div class="flex-1 flex items-center justify-center bg-[#111b21] py-8">
    <div class="bg-[#202c33] p-8 rounded-lg shadow-lg w-full max-w-md border border-[#2a3942]">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-light text-[#e9edef] mb-2">Create Account</h1>
            <p class="text-gray-400">Join GroupsApp today</p>
        </div>

        <form id="register-form" class="space-y-5">
            <div id="error-msg" class="hidden bg-red-900/50 text-red-200 p-3 rounded text-sm text-center"></div>

            <div>
                <label for="username" class="block text-sm font-medium text-gray-300 mb-1">Username</label>
                <input type="text" id="username" required
                       class="w-full bg-[#2a3942] border border-transparent focus:border-[#00a884] rounded px-4 py-2 text-[#e9edef] outline-none transition-colors">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                <input type="email" id="email" required
                       class="w-full bg-[#2a3942] border border-transparent focus:border-[#00a884] rounded px-4 py-2 text-[#e9edef] outline-none transition-colors">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                <input type="password" id="password" required minlength="8"
                       class="w-full bg-[#2a3942] border border-transparent focus:border-[#00a884] rounded px-4 py-2 text-[#e9edef] outline-none transition-colors">
            </div>

            <div>
                <label for="password_confirm" class="block text-sm font-medium text-gray-300 mb-1">Confirm Password</label>
                <input type="password" id="password_confirm" required minlength="8"
                       class="w-full bg-[#2a3942] border border-transparent focus:border-[#00a884] rounded px-4 py-2 text-[#e9edef] outline-none transition-colors">
            </div>

            <button type="submit"
                    class="w-full bg-[#00a884] hover:bg-[#008f6f] text-[#111b21] font-semibold py-2 px-4 rounded transition-colors focus:outline-none focus:ring-2 focus:ring-[#00a884] mt-2">
                Register
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-gray-400">
            Already have an account?
            <a href="/auth/login/" class="text-[#00a884] hover:text-[#008f6f] font-semibold transition-colors">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('access_token')) {
            window.location.href = '/app/';
            return;
        }

        const form = document.getElementById('register-form');
        const errorMsg = document.getElementById('error-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const password_confirm = document.getElementById('password_confirm').value;

            if (password !== password_confirm) {
                errorMsg.textContent = 'Passwords do not match';
                errorMsg.classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, password_confirm })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('refresh_token', data.refresh_token);
                    localStorage.setItem('user_id', data.user.id);
                    localStorage.setItem('user_data', JSON.stringify(data.user));
                    window.location.href = '/app/';
                } else {
                    let errStr = data.error?.message || 'Registration failed';
                    if (data.error?.details) {
                        const firstKey = Object.keys(data.error.details)[0];
                        errStr += `: ${data.error.details[firstKey][0] || data.error.details[firstKey]}`;
                    }
                    errorMsg.textContent = errStr;
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = 'Server error. Please try again later.';
                errorMsg.classList.remove('hidden');
            }
        });
    });
</script>
{% endblock %}
