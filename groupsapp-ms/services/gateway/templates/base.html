<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GroupsApp{% endblock %}</title>

    <!-- Tailwind CSS (CDN for development) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configuración personalizada de Tailwind para colores oscuros estilo WA -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wa: {
                            dark: '#111b21',
                            darker: '#0b141a',
                            panel: '#202c33',
                            border: '#2a3942',
                            light: '#e9edef',
                            accent: '#00a884',
                            accenthover: '#008f6f'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Scrollbar Styles -->
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.16);
            border-radius: 10px;
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body class="bg-wa-dark text-wa-light font-sans antialiased h-screen overflow-hidden flex flex-col">

    <!-- The main layout block -->
    {% block content %}
    {% endblock %}

    <!-- Common or specific scripts -->
    {% block scripts %}
    {% endblock %}
</body>
</html>
