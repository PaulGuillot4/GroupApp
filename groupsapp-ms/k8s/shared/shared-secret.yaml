# ─────────────────────────────────────────────────────────────
# Secret compartido — credenciales de PostgreSQL y JWT
# Usado por: auth, users, groups, messaging, files
#
# Valores en base64:
#   echo -n "postgres" | base64    → cG9zdGdyZXM=
#   echo -n "groupsapp_ms" | base64 → Z3JvdXBzYXBwX21z
#   echo -n "change-me-in-prod" | base64 → Y2hhbmdlLW1lLWluLXByb2Q=
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: groupsapp-secret
  namespace: groupsapp
  labels:
    project: groupsapp
type: Opaque
data:
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cG9zdGdyZXM=
  JWT_SECRET_KEY: Y2hhbmdlLW1lLWluLXByb2Q=
  # ── MongoDB (echo -n "admin" | base64 → YWRtaW4=) ──
  MONGO_USER: YWRtaW4=
  MONGO_PASSWORD: Z3JvdXBzYXBwX21vbmdv
