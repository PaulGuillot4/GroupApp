# ─────────────────────────────────────────────────────────────
# Auth — Deployment (2 réplicas) + Service ClusterIP
# gRPC :50051
#
# IMAGEN: usa ECR. Antes de aplicar, reemplazar ACCOUNT_ID:
#   sed -i "s/ACCOUNT_ID/${ACCOUNT_ID}/g" k8s/services/auth.yaml
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: groupsapp
  labels:
    app: auth
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
        tier: backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth
          # ── ECR image (reemplazar ACCOUNT_ID) ──
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/groupsapp/auth:latest
          imagePullPolicy: Always
          ports:
            - name: grpc
              containerPort: 50051
          envFrom:
            - configMapRef:
                name: groupsapp-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: groupsapp-secret, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: groupsapp-secret, key: POSTGRES_PASSWORD }
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: groupsapp-secret, key: JWT_SECRET_KEY }
          # ── gRPC readiness via tcp (sin dependencia de grpc-health) ──
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: groupsapp
  labels: { app: auth }
spec:
  type: ClusterIP
  selector: { app: auth }
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      appProtocol: grpc
