# ─────────────────────────────────────────────────────────────
# Gateway — Deployment (2 réplicas) + Service ClusterIP
# HTTP :8000 — punto de entrada del sistema
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: groupsapp
  labels:
    app: gateway
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        tier: frontend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          # ── ECR image (reemplazar ACCOUNT_ID) ──
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/groupsapp/gateway:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: groupsapp-config
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: groupsapp
  labels: { app: gateway }
spec:
  type: ClusterIP
  selector: { app: gateway }
  ports:
    - name: http
      port: 8000
      targetPort: http
      appProtocol: http
