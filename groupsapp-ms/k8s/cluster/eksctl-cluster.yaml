# ─────────────────────────────────────────────────────────────
# Clúster EKS para GroupsApp — CORREGIDO PARA AWS ACADEMY
#
# Uso:
#   eksctl create cluster -f k8s/cluster/eksctl-cluster.yaml
#
# IMPORTANTE: Reemplazar 550872379330 con tu ID real:
#   aws sts get-caller-identity --query 'Account' --output text
# ─────────────────────────────────────────────────────────────
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: groupsapp-cluster
  region: us-east-1
  version: "1.30"

# ── CLAVE AWS ACADEMY: usar LabRole para el clúster (ServiceRole) ──
iam:
  serviceRoleARN: "arn:aws:iam::263106799112:role/LabRole"

# ⚠️ AWS ACADEMY: NO incluir iam.withOIDC (no se puede crear OIDC provider)
# ⚠️ AWS ACADEMY: NO incluir cloudWatch.clusterLogging (falla por permisos)

managedNodeGroups:
  - name: workers
    instanceType: t3.medium         # 2 vCPU, 4 GB RAM — suficiente para 7 microservicios + infra
    desiredCapacity: 2
    minSize: 2
    maxSize: 4                      # Autoescalado si la carga sube
    volumeSize: 30                  # GB de disco por nodo
    labels:
      role: worker
    tags:
      environment: staging
    # ── CLAVE AWS ACADEMY: usar LabRole existente ──
    iam:
      instanceRoleARN: arn:aws:iam::263106799112:role/LabRole
      # NO incluir attachPolicyARNs — LabRole ya tiene permisos necesarios:
      #   - AmazonEKSWorkerNodePolicy
      #   - AmazonEKS_CNI_Policy
      #   - AmazonEC2ContainerRegistryReadOnly
      #   - AmazonSSMManagedInstanceCore

# ── Addons del clúster ──
addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
