##############################################################
# Deployment – servicio Users (gRPC :50052 + REST :8003)
#
# Réplicas: 2
# Probes:  httpGet en /health puerto 8003 (REST)
#
# Resiliencia (pruebas de calidad / chaos):
#   • PodDisruptionBudget (abajo) garantiza ≥1 pod vivo
#   • podAntiAffinity distribuye pods en nodos distintos
#   • terminationGracePeriodSeconds da 30s de gracia
#
# NOTA: Este archivo es una versión extendida de k8s/services/users.yaml
#       con features avanzados de resiliencia. Usar UNO u OTRO, no ambos.
##############################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  namespace: groupsapp
  labels:
    app: users
    tier: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # 0 → nunca hay downtime durante rolling updates
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
        tier: backend
    spec:
      terminationGracePeriodSeconds: 30

      # ── Anti-afinidad: distribuir réplicas en nodos diferentes ──
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["users"]
                topologyKey: kubernetes.io/hostname

      containers:
        - name: users
          # ── ECR image (reemplazar ACCOUNT_ID) ──
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/groupsapp/users:latest
          imagePullPolicy: Always
          ports:
            - name: grpc
              containerPort: 50052
              protocol: TCP
            - name: metrics
              containerPort: 8003
              protocol: TCP

          # ── Variables de entorno: ConfigMap COMPARTIDO ──
          envFrom:
            - configMapRef:
                name: groupsapp-config

          # ── Variables de entorno: Secret COMPARTIDO ──
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: groupsapp-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: groupsapp-secret
                  key: POSTGRES_PASSWORD

          # ── Probes HTTP (usando /health de REST en puerto 8003) ────
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          startupProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12   # 5 + (5×12) = 65s máximo para arrancar

          # ── Graceful shutdown ──
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]

          # ── Recursos ──
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
##############################################################
# PodDisruptionBudget
##############################################################
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: users-pdb
  namespace: groupsapp
  labels:
    app: users
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: users
