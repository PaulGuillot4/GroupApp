##############################################################
# Secret – credenciales sensibles del servicio Users
# Fuentes:
#   POSTGRES_USER     → src/db.py línea 8  (os.getenv)
#   POSTGRES_PASSWORD → src/db.py línea 9  (os.getenv)
#
# NOTA: Los valores están en base64.
#   echo -n "postgres" | base64  →  cG9zdGdyZXM=
#
# En producción se recomienda:
#   ▸ AWS Secrets Manager + External Secrets Operator
#   ▸ Sealed Secrets
#   ▸ NUNCA comitear este archivo con valores reales a Git.
##############################################################
apiVersion: v1
kind: Secret
metadata:
  name: users-secret
  namespace: groupsapp
  labels:
    app: users
    tier: backend
type: Opaque
data:
  POSTGRES_USER: cG9zdGdyZXM=           # "postgres"
  POSTGRES_PASSWORD: cG9zdGdyZXM=       # "postgres"  ← CAMBIAR EN PROD
